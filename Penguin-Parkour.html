<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Penguin Parkour Final</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #aaddff;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        #info {
            position: absolute;
            bottom: 30px; width: 100%;
            text-align: center;
            color: #37474f;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #fff;
            background: rgba(255,255,255,0.3);
            padding: 10px 0;
        }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: white;
            border: 2px solid rgba(0,0,0,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.8;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        h1 { margin: 0 0 10px 0; color: #37474f; font-size: 48px; }
        p { color: #555; font-size: 18px; margin-bottom: 30px; text-align: center;}
        button {
            padding: 20px 50px;
            font-size: 24px;
            background: #ffaa00;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #cc8800;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc8800; }
        button:hover { background: #ffbb33; }
        #win-msg { display: none; color: #00aa00; font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        
        /* Mobile/Touch controls hint */
        .mobile-hint { font-size: 14px; color: #888; margin-top: 20px; }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="info">WASD to Move &bull; SHIFT Run &bull; SPACE Jump<br><span style="font-size:14px; opacity:0.8">(If mouse doesn't lock: Click & Drag to look)</span></div>
    </div>

    <div id="overlay">
        <h1 id="title">PENGUIN PARKOUR</h1>
        <p>Re-written to fix button issues.<br>Click Start to Play.</p>
        <div id="win-msg">COURSE COMPLETED!</div>
        <button id="start-btn">CLICK TO START</button>
        <div class="mobile-hint">Works best on Desktop Chrome/Edge/Firefox</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const SETTINGS = {
            gravity: 50,
            jumpForce: 17,
            walkSpeed: 8,
            sprintSpeed: 16,
            friction: 10,
            bg: 0xAADDFF,
            camSens: 0.002
        };

        const inputs = { w:false, a:false, s:false, d:false, space:false, shift:false };
        let isPlaying = false;
        let isDragging = false; // Fallback for no pointer lock

        // Camera State
        const camState = {
            yaw: Math.PI,   
            pitch: 0.3,     
            dist: 10,
            baseFov: 60
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SETTINGS.bg);
        scene.fog = new THREE.Fog(SETTINGS.bg, 20, 80);

        const camera = new THREE.PerspectiveCamera(camState.baseFov, window.innerWidth/window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);
        
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(30, 50, 20);
        sun.castShadow = true;
        sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
        sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
        sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- Voxel Helpers ---
        const boxGeo = new THREE.BoxGeometry(1,1,1);
        const materials = {};
        function getMat(color) {
            if(!materials[color]) materials[color] = new THREE.MeshStandardMaterial({ color: color });
            return materials[color];
        }
        function createVoxel(x, y, z, color, parent, sx=1, sy=1, sz=1) {
            const m = new THREE.Mesh(boxGeo, getMat(color));
            m.position.set(x, y, z);
            m.scale.set(sx, sy, sz);
            m.castShadow = true;
            m.receiveShadow = true;
            parent.add(m);
            return m;
        }

        // --- Player ---
        const penguinGroup = new THREE.Group();
        const penguinBody = new THREE.Group(); 
        penguinGroup.add(penguinBody);
        scene.add(penguinGroup);

        const player = {
            velocity: new THREE.Vector3(),
            onGround: false
        };

        // Penguin Model
        function buildPenguin() {
            const S = 0.2; 
            const C = { BK:0x2C2C2C, WT:0xF0F0F0, OR:0xFFAA00 };
            createVoxel(-1.5*S, 0, 0.5*S, C.OR, penguinBody, S, S, S);
            createVoxel(1.5*S, 0, 0.5*S, C.OR, penguinBody, S, S, S);
            createVoxel(0, 3.5*S, 0, C.BK, penguinBody, 5*S, 6*S, 3*S);
            createVoxel(0, 3.5*S, 0.6*S, C.WT, penguinBody, 3.2*S, 5*S, 2*S); 
            createVoxel(0, 7*S, 0, C.BK, penguinBody, 5*S, 2*S, 4*S);
            createVoxel(-1*S, 7*S, 2.1*S, C.WT, penguinBody, 1.2*S, 1.2*S, 0.2*S);
            createVoxel(1*S, 7*S, 2.1*S, C.WT, penguinBody, 1.2*S, 1.2*S, 0.2*S);
            createVoxel(-1*S, 7*S, 2.25*S, C.BK, penguinBody, 0.4*S, 0.4*S, 0.2*S);
            createVoxel(1*S, 7*S, 2.25*S, C.BK, penguinBody, 0.4*S, 0.4*S, 0.2*S);
            createVoxel(0, 6.2*S, 2.2*S, C.OR, penguinBody, 1*S, 0.5*S, 1.5*S);
            createVoxel(-2.8*S, 3.5*S, 0, C.BK, penguinBody, 0.5*S, 3*S, 1.5*S);
            createVoxel(2.8*S, 3.5*S, 0, C.BK, penguinBody, 0.5*S, 3*S, 1.5*S);
        }
        buildPenguin();

        // Speed Lines
        const linesGroup = new THREE.Group();
        penguinGroup.add(linesGroup);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
        const speedLines = [];
        for(let i=0; i<10; i++) {
            const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 2), lineMat.clone());
            l.position.set((Math.random()-0.5)*3, (Math.random())*2, (Math.random()-0.5)*3);
            linesGroup.add(l);
            speedLines.push({ mesh: l, speed: Math.random()*0.5 + 0.5 });
        }

        // --- Level Generation ---
        const platforms = []; 
        const levelGroup = new THREE.Group();
        scene.add(levelGroup);
        let goalObject;

        function addPlatform(x, y, z, w, d, color=0xA5D6E8) {
            const h = 1;
            createVoxel(x, y - h/2, z, color, levelGroup, w, h, d);
            platforms.push({ minX: x-w/2, maxX: x+w/2, minY: y-h, maxY: y, minZ: z-d/2, maxZ: z+d/2 });
        }

        function buildLevel() {
            while(levelGroup.children.length > 0) levelGroup.remove(levelGroup.children[0]);
            platforms.length = 0;
            addPlatform(0, 0, 0, 8, 8);
            addPlatform(0, 1.5, -8, 3, 3);
            addPlatform(0, 3.0, -14, 3, 3);
            addPlatform(-5, 4.0, -14, 4, 3);
            addPlatform(-10, 5.0, -14, 3, 3);
            addPlatform(-10, 6.0, -9, 2, 2);
            addPlatform(-10, 7.0, -5, 2, 2);
            addPlatform(-10, 8.0, -1, 2, 2);
            addPlatform(-5, 8.0, 3, 4, 4);
            addPlatform(2, 9.5, 3, 2.5, 2.5);
            addPlatform(7, 11.0, 3, 4, 4, 0xFFD700);
            const sea = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshBasicMaterial({ color: 0x226699, transparent:true, opacity:0.8 }));
            sea.rotation.x = -Math.PI/2; sea.position.y = -5;
            levelGroup.add(sea);
            const fishGroup = new THREE.Group();
            createVoxel(0,0,0, 0xFF4444, fishGroup, 0.5, 0.3, 0.1);
            createVoxel(-0.4,0,0, 0xFF4444, fishGroup, 0.2, 0.3, 0.1);
            fishGroup.position.set(7, 12.5, 3);
            scene.add(fishGroup);
            goalObject = fishGroup;
        }

        // --- Physics ---
        const tempPos = new THREE.Vector3();
        function updatePhysics(dt) {
            if(!isPlaying) return;

            const camDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), camState.yaw);
            const camRight = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), camState.yaw);

            let moveDir = new THREE.Vector3();
            if(inputs.w) moveDir.add(camDir);
            if(inputs.s) moveDir.sub(camDir);
            if(inputs.d) moveDir.add(camRight);
            if(inputs.a) moveDir.sub(camRight);

            if(moveDir.lengthSq() > 0) moveDir.normalize();

            const currentSpeedVal = inputs.shift ? SETTINGS.sprintSpeed : SETTINGS.walkSpeed;
            
            if(moveDir.lengthSq() > 0) {
                player.velocity.x += moveDir.x * currentSpeedVal * dt * 8;
                player.velocity.z += moveDir.z * currentSpeedVal * dt * 8;
            }

            player.velocity.x -= player.velocity.x * SETTINGS.friction * dt;
            player.velocity.z -= player.velocity.z * SETTINGS.friction * dt;
            player.velocity.y -= SETTINGS.gravity * dt;

            if(inputs.space && player.onGround) {
                player.velocity.y = SETTINGS.jumpForce;
                player.onGround = false;
            }

            tempPos.copy(penguinGroup.position);
            tempPos.addScaledVector(player.velocity, dt);
            player.onGround = false;

            for(const plat of platforms) {
                if(tempPos.x > plat.minX && tempPos.x < plat.maxX &&
                   tempPos.z > plat.minZ && tempPos.z < plat.maxZ) {
                    if(penguinGroup.position.y >= plat.maxY && tempPos.y <= plat.maxY) {
                        tempPos.y = plat.maxY;
                        player.velocity.y = 0;
                        player.onGround = true;
                    }
                }
            }
            penguinGroup.position.copy(tempPos);

            const horizontalVel = new THREE.Vector2(player.velocity.x, player.velocity.z);
            if(horizontalVel.length() > 1.0) {
                const targetRot = Math.atan2(player.velocity.x, player.velocity.z);
                let rotDiff = targetRot - penguinBody.rotation.y;
                while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
                while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
                penguinBody.rotation.y += rotDiff * dt * 10;
            }

            if(player.onGround && horizontalVel.length() > 0.5) {
                const waddleSpeed = inputs.shift ? 25 : 15;
                penguinBody.rotation.z = Math.sin(Date.now() * 0.001 * waddleSpeed) * 0.1;
                
                if(inputs.shift) {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, camState.baseFov + 10, dt * 5);
                    linesGroup.visible = true;
                    speedLines.forEach(l => {
                        l.mesh.position.z += l.speed;
                        l.mesh.material.opacity = 0.5;
                        if(l.mesh.position.z > 2) l.mesh.position.z = -3;
                    });
                } else {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, camState.baseFov, dt * 5);
                    linesGroup.visible = false;
                }
            } else {
                penguinBody.rotation.z *= 0.8;
                camera.fov = THREE.MathUtils.lerp(camera.fov, camState.baseFov, dt * 5);
                linesGroup.visible = false;
            }
            camera.updateProjectionMatrix();

            if(penguinGroup.position.distanceTo(goalObject.position) < 1.5) winGame();
            if(penguinGroup.position.y < -5) resetPosition();
        }

        function updateCamera() {
            const y = Math.sin(camState.pitch) * camState.dist;
            const hDist = Math.cos(camState.pitch) * camState.dist;
            const x = Math.sin(camState.yaw) * hDist;
            const z = Math.cos(camState.yaw) * hDist;
            const target = penguinGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
            const desiredPos = target.clone().add(new THREE.Vector3(x, y, z));
            camera.position.lerp(desiredPos, 0.5); 
            camera.lookAt(target);
        }

        // --- Input Handling ---
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        // Handle Controls
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(inputs.hasOwnProperty(k) || k===" ") inputs[k===" "?"space":k] = true;
            if(e.key === "Shift") inputs.shift = true;
            // Escape to pause
            if(e.key === "Escape") {
                isPlaying = false;
                overlay.style.display = 'flex';
                document.exitPointerLock();
            }
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(inputs.hasOwnProperty(k) || k===" ") inputs[k===" "?"space":k] = false;
            if(e.key === "Shift") inputs.shift = false;
        });

        // ROBUST START LOGIC
        startBtn.addEventListener('click', () => {
            // 1. Always start game state immediately
            overlay.style.display = 'none';
            isPlaying = true;

            // 2. Try to lock (might fail in iframes)
            try {
                document.body.requestPointerLock();
            } catch(e) {
                console.warn("Pointer Lock blocked. Using fallback.");
            }
        });

        // Detect if lock actually happened
        document.addEventListener('pointerlockchange', () => {
            if(document.pointerLockElement === document.body) {
                isPlaying = true;
                overlay.style.display = 'none';
                isDragging = false;
            } else {
                // Only pause if we aren't in fallback mode
                if(!isDragging) {
                    // isPlaying = false; 
                    // We don't force pause here because it might annoy fallback users
                }
            }
        });

        // Mouse Look Logic (Works for both Locked and Dragging)
        window.addEventListener('mousedown', () => { if(isPlaying && !document.pointerLockElement) isDragging = true; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        window.addEventListener('mousemove', (e) => {
            // Move if Locked OR (Not Locked AND Dragging)
            if(document.pointerLockElement === document.body || (isPlaying && isDragging)) {
                camState.yaw -= e.movementX * SETTINGS.camSens;
                camState.pitch += e.movementY * SETTINGS.camSens;
                const limit = Math.PI / 2 - 0.1;
                camState.pitch = Math.max(0.1, Math.min(limit, camState.pitch));
            }
        });

        function resetPosition() {
            penguinGroup.position.set(0, 0.5, 0);
            player.velocity.set(0,0,0);
            camState.yaw = Math.PI; 
            camState.pitch = 0.3;
        }

        function winGame() {
            document.exitPointerLock();
            isPlaying = false;
            document.getElementById('title').innerText = "VICTORY!";
            document.getElementById('win-msg').style.display = "block";
            startBtn.innerText = "PLAY AGAIN";
            overlay.style.display = "flex";
            resetPosition();
        }

        // --- Loop ---
        const clock = new THREE.Clock();
        buildLevel();
        
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            updatePhysics(dt);
            updateCamera();
            if(goalObject) {
                goalObject.rotation.y += 2 * dt;
                goalObject.position.y = 12.5 + Math.sin(Date.now() * 0.005) * 0.5;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
