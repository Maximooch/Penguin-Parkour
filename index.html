<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Penguin Parkour</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="game-container"></div>

  <!-- UI Overlays (will be managed by UIManager later) -->
  <div id="ui-overlay">
    <!-- Main Menu -->
    <div id="menu" class="menu">
      <h1>Voxel Penguin Parkour</h1>
      <button id="start-button" class="menu-button">Start Game</button>
      <button id="settings-button" class="menu-button secondary">Settings</button>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="settings-panel hidden">
      <h2>Settings</h2>

      <div class="settings-section">
        <h3>Controls</h3>
        <div class="settings-row">
          <label for="mouse-sensitivity">Mouse Sensitivity</label>
          <input type="range" id="mouse-sensitivity" min="0.1" max="3" step="0.1" value="1">
          <span id="mouse-sensitivity-value">1.0</span>
        </div>
      </div>

      <div class="settings-section">
        <h3>Audio</h3>
        <div class="settings-row">
          <label for="master-volume">Master Volume</label>
          <input type="range" id="master-volume" min="0" max="1" step="0.05" value="0.8">
          <span id="master-volume-value">80%</span>
        </div>
        <div class="settings-row">
          <label for="music-volume">Music Volume</label>
          <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.6">
          <span id="music-volume-value">60%</span>
        </div>
        <div class="settings-row">
          <label for="sfx-volume">SFX Volume</label>
          <input type="range" id="sfx-volume" min="0" max="1" step="0.05" value="1">
          <span id="sfx-volume-value">100%</span>
        </div>
      </div>

      <div class="settings-buttons">
        <button id="settings-reset" class="menu-button secondary">Reset to Defaults</button>
        <button id="settings-back" class="menu-button">Back to Menu</button>
      </div>
    </div>
  </div>

  <!-- Game canvas will be inserted here by Three.js -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
